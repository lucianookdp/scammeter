name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "packages/core/**"
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  # The page reads the phishing and popularity lists from its own origin;
  # rebuilding daily keeps them fresh (the lookup refuses a copy over 3 days old).
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lists
      - run: pnpm build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
