<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Cole o link de um site e veja se é golpe, e por quê." />
    <!-- The page takes a URL from a stranger and shows what a third-party API
         says about it, so pin exactly where scripts, styles and connections
         may come from. 'unsafe-inline' covers only the pre-paint theme script.
         frame-ancestors is omitted: a <meta> CSP cannot carry it, and Pages
         serves no headers of our own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data:;
               connect-src 'self' https://scammeter-proxy-production.up.railway.app http://localhost:8787;
               form-action 'none';
               base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Scammeter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      // Set the theme before first paint so there's no flash of the wrong colors.
      (function () {
        try {
          var saved = localStorage.getItem("scammeter-theme");
          var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand">
          <svg class="mark" viewBox="0 0 200 120" aria-hidden="true">
            <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" />
            <line x1="100" y1="100" x2="100" y2="32" stroke="currentColor" stroke-width="11" stroke-linecap="round" transform="rotate(25 100 100)" />
            <circle cx="100" cy="100" r="11" fill="currentColor" />
          </svg>
          <span id="brand-name"></span>
        </div>

        <button type="button" id="theme-toggle" class="icon-btn">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="app">
      <div class="intro">
        <p id="tagline"></p>

      <ul class="trust-chips">
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 16 4-4-4-4" /><path d="m6 8-4 4 4 4" /><path d="m14.5 4-5 16" /></svg>
          <span id="chip-open-source"></span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
            />
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
            <path
              d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
            />
            <path d="m2 2 20 20" />
          </svg>
          <span id="chip-no-tracking"></span>
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
            />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <span id="chip-cnpj-pix"></span>
        </li>
      </ul>
      </div>

      <div class="card">
        <section class="gauge-panel">
          <svg class="gauge idle" viewBox="0 0 200 112" role="img" aria-label="Medidor de risco">
            <path class="zone zone-low" d="M20,100 A80,80 0 0 1 33.9,54.92" />
            <path class="zone zone-mid" d="M33.9,54.92 A80,80 0 0 1 97.49,20.04" />
            <path class="zone zone-high" d="M97.49,20.04 A80,80 0 0 1 180,100" />
            <g class="needle-group">
              <line class="needle" x1="100" y1="100" x2="100" y2="32" />
            </g>
            <circle class="hub-ring" cx="100" cy="100" r="8" />
            <circle class="hub" cx="100" cy="100" r="3.5" />
          </svg>
          <div class="readout">
            <span id="score" class="score">—</span>
            <span id="badge" class="badge"></span>
          </div>
          <p id="gauge-caption" class="gauge-caption" aria-live="polite"></p>
        </section>

        <form id="check-form" novalidate>
          <label class="field">
            <span id="label-link"></span>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                <path d="M2 12h20" />
              </svg>
              <input id="input-link" type="url" required placeholder="https://" autocomplete="url" />
            </div>
            <span id="link-error" class="field-error" hidden></span>
          </label>

          <details id="advanced">
            <summary id="label-advanced">
              <svg class="icon-square" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="18" height="18" x="3" y="3" rx="2" />
              </svg>
              <svg class="icon-square-check" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="m16 9-5.5 5.5L8 12" />
              </svg>
              <span id="label-advanced-text"></span>
            </summary>
            <label class="field">
              <span id="label-cnpj"></span>
              <input id="input-cnpj" type="text" placeholder="00.000.000/0001-00" />
              <span id="scan-hint" class="field-hint" hidden></span>
            </label>
            <label class="field">
              <span id="label-pix"></span>
              <textarea id="input-pix" rows="2" placeholder="00020126..."></textarea>
            </label>
          </details>

          <button type="submit" id="submit-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 11 2 2 4-4" />
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <span id="submit-btn-text"></span>
          </button>
        </form>

        <p id="alertbar" class="alertbar" role="status" hidden></p>

        <div id="results" class="results" hidden>
          <section class="group" id="group-alert" hidden>
            <h3 class="group-title group-title-alert"></h3>
            <ul class="reasons"></ul>
          </section>
          <section class="group" id="group-ok" hidden>
            <h3 class="group-title group-title-ok"></h3>
            <ul class="reasons"></ul>
          </section>
          <section class="group" id="group-unverified" hidden>
            <h3 class="group-title group-title-unverified"></h3>
            <ul class="reasons"></ul>
          </section>

          <section class="group" id="group-checks" hidden>
            <h3 class="group-title"></h3>
            <dl class="checks"></dl>
          </section>

          <a id="fact-reclameaqui" class="fact fact-link" hidden target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 3h6v6" />
              <path d="M10 14 21 3" />
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            </svg>
            <span id="fact-reclameaqui-text"></span>
          </a>
        </div>
      </div>

    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p id="footer-note" class="footnote"></p>
        <a class="footer-link" href="https://github.com/lucianookdp/scammeter" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            />
            <path d="M9 18c-4.51 2-5-2-7-2" />
          </svg>
          <span id="footer-github-text"></span>
        </a>
      </div>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
